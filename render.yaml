services:
  - type: web
    name: ricky-market
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: ricky-market-visits
      mountPath: /opt/render/project/src/data
      sizeGB: 1
